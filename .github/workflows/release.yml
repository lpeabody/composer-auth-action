name: Release

# Keep the floating major tag (v1, v2, ...) pointing at the latest release so
# callers can pin `lpeabody/composer-auth-action@v1`.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the major version tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' is not a vN.N.N release tag; nothing to do"; exit 0 ;;
          esac
          major="${TAG%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a "$major" -m "Point $major at $TAG" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "$major -> $TAG"
